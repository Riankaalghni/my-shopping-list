<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Shopping List</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="logo">🛒</div>

            <h1>My Shopping List</h1>
            <p class="subtitle" id="authSubtitle">
                Masuk untuk mengelola daftar belanjamu.
            </p>

            <div id="message" class="message" role="status"></div>

            <form id="loginForm">
                <label for="loginUsername">Username</label>
                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Masukkan username"
                    minlength="3"
                    maxlength="20"
                    autocomplete="username"
                    required
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Login</button>
            </form>

            <form id="registerForm" hidden>
                <label for="registerUsername">Buat Username</label>
                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Minimal 3 karakter"
                    minlength="3"
                    maxlength="20"
                    autocomplete="username"
                    required
                >

                <label for="registerPassword">Buat Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Minimal 6 karakter"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmPassword">Ulangi Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Ulangi password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button type="submit">Daftar Akun</button>
            </form>

            <p class="switch-text" id="switchText">
                Belum punya akun?
                <button type="button" class="link-button" id="showRegister">
                    Daftar di sini
                </button>
            </p>

            <p class="note">
                Akun demo disimpan di browser yang kamu gunakan.
            </p>
        </section>
    </main>

    <script src="auth.js"></script>
</body>
</html>
